# 在真正的 Windows 上测试、打包。发布到 Releases 有两种方式：
# 1. 推送 v 开头的标签（比如 v0.4.0）；
# 2. 在 Actions 页面手动运行，填上版本号（比如 0.4.0）——GitHub 会自己建标签和发布页。
name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（比如 0.4.0）。留空就只测试和打包，不发布。"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest
      - name: 运行测试（真正的 Windows，包括真的移到回收站）
        env:
          LIUBAI_REAL_WINDOWS: "1"
        run: python -m pytest -q tests -rs

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pyinstaller
      - name: 版本号
        id: v
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $want = "${{ github.event.inputs.version }}"
          $publish = "false"
          if ($want -match '^\d+\.\d+\.\d+$') { $v = $want; $publish = "true" }
          elseif ($ref -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1]; $publish = "true" }
          else { $v = (python main.py --version) + "-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, publish $publish"
      - name: 打包程序（PyInstaller）
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/liubai.spec
      - name: 检查打包结果能启动
        shell: pwsh
        run: |
          $p = Start-Process dist\Liubai\Liubai.exe -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Liubai.exe --version exit $($p.ExitCode)" }
      - name: 做安装程序（Inno Setup）
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile packaging\ChineseSimplified.isl
          } catch { Write-Host "没下载到中文语言文件，安装界面用英文" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: 安装、检查右键菜单、卸载（真正的 Windows）
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Liubai-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=contextmenu" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "安装失败：$($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Liubai\Liubai.exe"
          if (-not (Test-Path $app)) { throw "装好以后找不到 $app" }
          $keys = @(
            @{ k = "HKCU:\Software\Classes\Directory\shell\Liubai\command"; arg = '"%1"' },
            @{ k = "HKCU:\Software\Classes\Directory\Background\shell\Liubai\command"; arg = '"%V"' },
            @{ k = "HKCU:\Software\Classes\Drive\shell\Liubai\command"; arg = '"%1"' }
          )
          foreach ($x in $keys) {
            $v = (Get-Item $x.k).GetValue("")
            Write-Host "$($x.k) = $v"
            if ($v -ne "`"$app`" $($x.arg)") { throw "右键菜单的命令不对：$v" }
          }
          $label = (Get-Item "HKCU:\Software\Classes\Directory\shell\Liubai").GetValue("")
          if ($label -ne "用留白看看这里") { throw "右键菜单的文字不对：$label" }
          # 带着文件夹启动：能起来、不崩（几秒后关掉）
          $run = Start-Process $app -ArgumentList "$env:USERPROFILE" -PassThru
          Start-Sleep -Seconds 8
          if ($run.HasExited -and $run.ExitCode -ne 0) { throw "带文件夹启动后退出了：$($run.ExitCode)" }
          if (-not $run.HasExited) { Stop-Process -Id $run.Id -Force }
          $un = Join-Path $env:LOCALAPPDATA "Programs\Liubai\unins000.exe"
          $p = Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          foreach ($x in $keys) { if (Test-Path $x.k) { throw "卸载以后右键菜单还在：$($x.k)" } }
          Write-Host "安装、右键菜单、卸载都正常"
      - name: 便携版（不用安装）
        shell: pwsh
        run: Compress-Archive -Path dist\Liubai\* -DestinationPath "dist\Liubai-${{ steps.v.outputs.version }}-portable.zip"
      - name: 校验值（SHA256）
        shell: pwsh
        run: |
          $lines = @("", "## 校验值（SHA256）", "", "下载后可以在 PowerShell 里用 ``Get-FileHash 文件名`` 核对。", "", "``````")
          Get-ChildItem dist\Liubai-Setup-*.exe, dist\Liubai-*-portable.zip | ForEach-Object {
            $lines += "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          }
          $lines += "``````"
          Add-Content -Path packaging\release-notes.md -Value $lines -Encoding utf8
          Get-Content packaging\release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: liubai-windows-${{ steps.v.outputs.version }}
          path: |
            dist/Liubai-Setup-*.exe
            dist/Liubai-*-portable.zip
      - name: 发布到 Releases
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --target "${{ github.sha }}" `
            "dist\Liubai-Setup-${{ steps.v.outputs.version }}.exe" `
            "dist\Liubai-${{ steps.v.outputs.version }}-portable.zip" `
            --title "留白 v${{ steps.v.outputs.version }}" --notes-file packaging\release-notes.md
