# 在真正的 Windows 上测试、打包。推送 v 开头的标签（比如 v0.4.0）时，自动发布到 Releases。
name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest
      - name: 运行测试（真正的 Windows）
        run: python -m pytest -q tests -rs

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt pyinstaller
      - name: 版本号
        id: v
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { $v = (python main.py --version) + "-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v"
      - name: 打包程序（PyInstaller）
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/liubai.spec
      - name: 检查打包结果能启动
        shell: pwsh
        run: |
          $p = Start-Process dist\Liubai\Liubai.exe -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Liubai.exe --version exit $($p.ExitCode)" }
      - name: 做安装程序（Inno Setup）
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile packaging\ChineseSimplified.isl
          } catch { Write-Host "没下载到中文语言文件，安装界面用英文" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: 便携版（不用安装）
        shell: pwsh
        run: Compress-Archive -Path dist\Liubai\* -DestinationPath "dist\Liubai-${{ steps.v.outputs.version }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: liubai-windows-${{ steps.v.outputs.version }}
          path: |
            dist/Liubai-Setup-*.exe
            dist/Liubai-*-portable.zip
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\Liubai-Setup-${{ steps.v.outputs.version }}.exe" `
            "dist\Liubai-${{ steps.v.outputs.version }}-portable.zip" `
            --title "留白 ${{ github.ref_name }}" --notes-file packaging\release-notes.md
