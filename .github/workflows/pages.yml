# 介绍页（site/）发布到 GitHub Pages：https://yunningtang.github.io/blankspace/
# 页面、截图、图标或水墨代码有变化时自动重新发布；也可以在 Actions 页面手动运行。
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "packaging/liubai.png"
      - "webui/ink.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 拼出要发布的文件夹
        run: python3 site/build.py _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
